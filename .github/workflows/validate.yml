name: Validate site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm, Node, and dependencies
        uses: pnpm/setup@v2
        with:
          version: 11.19.0
          runtime: node@24
          cache: true

      - name: Run unit tests
        run: pnpm test

      - name: Build and check every generated route
        run: pnpm build

      - name: Install browser for accessibility and responsive checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e
