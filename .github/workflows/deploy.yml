name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      draft_preview:
        description: Publish the visibly marked draft for organizer review
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * *"
      timezone: "America/New_York"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate launch settings, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: pnpm@11.19.0
          build-cmd: >-
            ${{ github.event_name == 'workflow_dispatch' && inputs.draft_preview == true
              && 'pnpm run test && pnpm run build'
              || 'pnpm run validate:launch && pnpm run test && pnpm run build' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
